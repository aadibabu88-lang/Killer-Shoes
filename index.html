<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KILLER SHOES | Rule The Street</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-bolt text-amber-500 text-xl"></i>
            <span class="font-black tracking-wider text-lg">KILLERSHOES</span>
        </div>
        <button onclick="toggleCart()" class="relative bg-zinc-900 border border-zinc-800 p-2.5 rounded-full hover:bg-zinc-800 transition">
            <i class="fa-solid fa-cart-shopping text-zinc-200"></i>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-amber-500 text-zinc-950 font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>
    </header>

    <!-- Hero Section -->
    <section class="p-4">
        <div class="relative rounded-3xl overflow-hidden bg-gradient-to-br from-zinc-900 to-zinc-900 border border-zinc-800 p-6 flex flex-col justify-between h-72">
            <div class="absolute right-0 bottom-0 w-1/2 opacity-40 pointer-events-none">
                <i class="fa-solid fa-shoe-prints text-9xl text-zinc-800"></i>
            </div>
            <div class="z-10">
                <span class="bg-amber-500/10 text-amber-400 text-xs px-3 py-1 rounded-full font-semibold border border-amber-500/20">NEW SEASON DROP</span>
                <h1 class="text-3xl font-black mt-3 leading-tight">STEP INTO THE<br><span class="text-amber-500">KILLER ZONE</span></h1>
            </div>
            <div class="z-10 flex gap-3">
                <a href="#shop" class="bg-amber-500 text-zinc-950 px-5 py-2.5 rounded-full font-bold text-sm shadow-lg shadow-amber-500/20">Explore Drop</a>
            </div>
        </div>
    </section>

    <!-- Search & Filter -->
    <section id="shop" class="px-4 py-2">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-500"></i>
            <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search kicks, sneakers, runners..." class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
        </div>
    </section>

    <!-- Product Grid -->
    <section class="px-4 py-4">
        <h2 class="text-lg font-bold mb-4">Featured Collection</h2>
        <div id="productGrid" class="grid grid-cols-2 gap-4">
            <!-- Products will load dynamically via JS -->
        </div>
    </section>

    <!-- Cart Drawer Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="w-full max-w-md bg-zinc-900 h-full p-5 flex flex-col justify-between border-l border-zinc-800">
            <div>
                <div class="flex items-center justify-between pb-4 border-b border-zinc-800">
                    <h2 class="text-lg font-bold">Your Cart</h2>
                    <button onclick="toggleCart()" class="text-zinc-400 hover:text-white text-xl font-bold">&times;</button>
                </div>
                <div id="cartItems" class="mt-4 space-y-3 overflow-y-auto max-h-[60vh]">
                    <!-- Cart items -->
                </div>
            </div>
            <div class="border-t border-zinc-800 pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total:</span>
                    <span id="cartTotal" class="text-amber-500">₹0</span>
                </div>
                <button onclick="alert('Order placed successfully! Thank you for shopping with Killer Shoes.')" class="w-full bg-amber-500 text-zinc-950 font-bold py-3 rounded-xl hover:bg-amber-400 transition">Checkout Now</button>
            </div>
        </div>
    </div>

    <!-- JavaScript for Functionality -->
    <script>
        const products = [
            { id: 1, name: "Killer Air Max", price: 2999, category: "Sneakers", img: "👟" },
            { id: 2, name: "Street Runner Pro", price: 3499, category: "Running", img: "⚡" },
            { id: 3, name: "Urban Flex Casual", price: 1999, category: "Casual", img: "🔥" },
            { id: 4, name: "Neon Strike Kicks", price: 4299, category: "Sneakers", img: "🌟" }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(p => `
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col justify-between">
                    <div class="bg-zinc-950 rounded-xl h-32 flex items-center justify-center text-4xl mb-3 border border-zinc-800/50">
                        ${p.img}
                    </div>
                    <div>
                        <h3 class="font-bold text-sm truncate">${p.name}</h3>
                        <p class="text-amber-500 font-black text-sm mt-1">₹${p.price}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 transition text-xs font-bold py-2 rounded-xl border border-zinc-700">
                        Add to Cart
                    </button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const cartItemsContainer = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-zinc-500 text-sm text-center py-8">Your cart is empty.</p>';
                document.getElementById('cartTotal').innerText = '₹0';
                return;
            }

            let total = 0;
            cartItemsContainer.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                        <div>
                            <h4 class="font-bold text-sm">${item.name}</h4>
                            <p class="text-amber-500 text-xs">₹${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 text-xs font-bold">Remove</button>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotal').innerText = `₹${total}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // Initial Load
        renderProducts(products);
    </script>
</body>
</html>
